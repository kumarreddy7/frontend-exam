<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infosys 2026 Batch Pseudo-Code - Official Answer Key & Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-elevated: #21262d;
      --border: #30363d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      margin: 0;
      padding: 30px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--accent);
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .sec-header {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text);
      margin: 28px 0 16px 0;
      padding-left: 10px;
      border-left: 3px solid var(--accent);
    }
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .q-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    pre {
      background: #080b0f;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      color: #e6edf3;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .opt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .opt-item {
      padding: 10px 14px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .opt-item.correct {
      background: rgba(46, 160, 67, 0.15);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }
    .exp-box {
      background: var(--surface-elevated);
      border-radius: 6px;
      padding: 14px 18px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .exp-box strong { color: var(--text); }
    .exp-box code {
      background: #080b0f;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      color: #e6edf3;
    }
    .exp-box ul, .exp-box ol { padding-left: 20px; margin: 8px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Infosys Pseudo-Code 2026 Batch &mdash; Official Solutions &amp; Answer Key</h1>
    <p>15 Questions &bull; 3 Sections &bull; Step-by-Step Mathematical &amp; Algorithmic Traces</p>
  </header>

  <div id="answers-container"></div>
</div>

<script src="questions.js"></script>
<script>
  const container = document.getElementById("answers-container");
  let currentSec = "";

  ExamQuestions.forEach((q, idx) => {
    if (q.sectionTitle !== currentSec) {
      currentSec = q.sectionTitle;
      const secHeading = document.createElement("div");
      secHeading.className = "sec-header";
      secHeading.textContent = currentSec;
      container.appendChild(secHeading);
    }

    const card = document.createElement("div");
    card.className = "q-card";

    let optsHtml = "";
    q.options.forEach(opt => {
      const isCorrect = opt.key === q.correctAnswer;
      optsHtml += `
        <div class="opt-item ${isCorrect ? 'correct' : ''}">
          Option ${opt.key}: ${opt.text} ${isCorrect ? '✓ (Correct)' : ''}
        </div>
      `;
    });

    card.innerHTML = `
      <div class="q-title">Q${idx + 1}: ${q.title}</div>
      <div style="font-size: 13.5px; margin-bottom: 10px; color: var(--text);">${q.prompt}</div>
      <pre><code>${q.pseudocode}</code></pre>
      <div class="opt-grid">${optsHtml}</div>
      <div class="exp-box">
        <strong style="color: var(--accent);">Detailed Explanation:</strong>
        <div>${q.explanation}</div>
      </div>
    `;
    container.appendChild(card);
  });
</script>
</body>
</html>
